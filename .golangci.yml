version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/NDari/rho # also matches github.com/NDari/rho-gui
